# Hand-written evaluation set for Ask-a-Care-Resource (India corpus).
#
# Fields
#   id            stable id
#   style         formal | stressed | hinglish | hindi    (how a real family member might ask)
#   answerable    false  -> the corpus does NOT contain the answer; the system must refuse
#   expected      list of GROUPS of document ids. Each group lists interchangeable documents
#                 (any one of them contains that part of the answer). A question with two
#                 groups needs a document from BOTH groups (multi-source question).
#                 Labelled at document level on purpose: chunk ids change with chunk size, so
#                 document labels stay valid across every experiment configuration.
#   key_facts     short strings a correct answer must contain (checked after normalising
#                 digits/commas/case); kept to numbers and names so the check is objective.
#   note          why the question is in the set / what it tests
#
# Every expected document and key fact was checked against data/processed/documents.jsonl.

questions:
  # ------------------------------------------------------------------ formal, single source
  - id: q01
    style: formal
    question: What is the toll-free number of the national helpline for senior citizens?
    answerable: true
    expected:
      - [pib_elderline_launch_2021, pib_elderline_study_2021, pib_elderline_2026, vikaspedia_elderline,
         pib_elderly_in_india_2025, pib_world_senior_citizen_day_2024, pib_senior_care_blog_2026,
         pib_schemes_senior_2022, pib_old_age_homes_2022]
    key_facts: ["14567"]
    note: easy baseline; many documents agree

  - id: q02
    style: formal
    question: What are the working hours of Elderline?
    answerable: true
    expected:
