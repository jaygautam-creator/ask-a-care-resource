ame":"Senior citizens Welfare ","item":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/senior-citizens-welfare?lgn=en"},{"@type":"ListItem","position":4,"name":"National Helpline for Senior Citizens Elderline 14567","item":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/senior-citizens-welfare/national-helpline-for-senior-citizens-elderline-14567?lgn=en"}]}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","mainEntityOfPage":{"@type":"WebPage","@id":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/senior-citizens-welfare/national-helpline-for-senior-citizens-elderline-14567?lgn=en"},"headline":"National Helpline for Senior Citizens Elderline 14567","description":"Provides information about National Helpline for Senior Citizens Elderline 14567","image":"https://static.vikaspedia.in/mediastorage/filestorage/20260716103827_elderline.webp","author":{"@type":"Person","name":"Vikaspedian"},"contributor":{"@type":"Person","name":"Vikaspedian"},"keywords":["senior citizen helpline","elderline","toll-free helpline","elderly care","14567","national helpline for senior citizens elderline 14567","ministry of social justice and empowerment","senior citizens helpline","elderline 14567","ageing with dignity","grievance redressal","ageing with dignity portal","elderly support services","toll free number for elderly"],"articleBody":"<p>The Ministry of Social Justice and Empowerment in its mission to ensure a life of dignity, security and inclusion for senior citizens has rolled out the National Helpline for Senior Citizens<strong>&nbsp;</strong>titled<strong> Elderline 14567.</strong></p>\n<p><strong>Elderline (14567)</strong>&nbsp;is a toll-free, pan-India helpline dedicated to addressing the concerns and grievances of senior citizens across the country.</p>\n<p>Dedicated to the nation on 1st October, 2021, the helpline operates all&nbsp;<strong>seven days in a week from 8:00 AM to 8:00 PM</strong>&nbsp;across all States and Union Territories. It serves as a single-window platform for providing information, guidance, emotional support and field interventions to elderly persons in need.</p>\n<p><img style=\"max-width: 100%; height: 247px; display: block; margin-left: auto; margin-right: auto;\" src=\"https://static.vikaspedia.in/mediastorage/filestorage/20260716103827_elderline.webp\" alt=\"Uploaded Image\" width=\"889\"></p>\n<h3>Vision and Mission of Elderline</h3>\n<div class=\"col-md-12\">\n<p>The vision of the Elderline is to connect and engage with Senior Citizens and serve them in a compassionate manner.</p>\n<p>The mission of the Elderline is to make a positive difference to the lives of senior citizens through a single platform by redressing grievances of the senior citizens, by providing necessary information and field intervention through a collective effort of highly committed partners including government agencies, non-profit organizations, private sector, organisations working for the senior citizen&rsquo;s cause and volunteers.</p>\n</div>\n<h3>Services offered through Elderline</h3>\n<p>The services offered through Elderline include information on healthcare facilities, old age homes, day-care centres, caregivers and elder-friendly products; guidance on legal issues, pension-related matters, government schemes, maintenance issues and dispute resolution.</p>\n<p>In addition, the Elderline covers field intervention for cases involving abuse, neglect, rescue, reunion of homeless senior citizens and emotional support to address loneliness, anxiety, family disputes and other psychosocial concerns.</p>\n<h3>How to access the Elderline</h3>\n<p>Dial 14567 from your mobile to access the services.</p>\n<p><strong>Source : <a title=\"External website that opens in new window\" href=\"https://scw.dosje.gov.in/\" target=\"_blank\" rel=\"noopener\">Ageing with Dignity portal&nbsp;</a></strong></p>","publisher":{"@type":"GovernmentOrganization","name": ic provides information about National Policy on Senior Citizens 2011. ","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/senior-citizens-welfare/policies-and-acts-1/national-policy-on-senior-citizens-2011?lgn=en"},{"lgn":"en","context_path":"/social-welfare/senior-citizens-welfare/schemes-for-senior-citizens","domain":"Social-Welfare","language":"English","id":2731,"title":"Schemes for senior citizens","summery":"This topic covers important Schemes related to Senior Citizens","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/senior-citizens-welfare/schemes-for-senior-citizens?lgn=en"},{"lgn":"en","context_path":"/social-welfare/social-awareness/consumer-education/state-consumer-helplines","domain":"Social-Welfare","language":"English","id":24975,"title":"State Consumer Helplines","summery":"Provides information related to State Consumer Helplines","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/social-awareness/consumer-education/state-consumer-helplines?lgn=en"},{"lgn":"en","context_path":"/social-welfare/women-and-child-development/women-development-1/pro-woman-initiatives/the-ncw-women-helpline-–-14490-a-dedicated-platform-for-womens-support","domain":"Social-Welfare","language":"English","id":413265,"title":"The NCW Women Helpline – 14490 : A Dedicated Platform for Women's Support","summery":"24/7 Helpline for Women Affected by Violence established by National Commission of Women - 14490.  ","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/women-and-child-development/women-development-1/pro-woman-initiatives/the-ncw-women-helpline-–-14490-a-dedicated-platform-for-womens-support?lgn=en"},{"lgn":"en","context_path":"/social-welfare/senior-citizens-welfare/senior-care-ageing-growth-engine","domain":"Social-Welfare","language":"English","id":413642,"title":"Senior care Ageing Growth Engine ","summery":"Provides information about 'Senior care Ageing Growth Engine' (SAGE) project to support India’s elderly.","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/senior-citizens-welfare/senior-care-ageing-growth-engine?lgn=en"},{"lgn":"en","context_path":"/social-welfare/community-power/census-2027/census-2027-assistance-and-support","domain":"Social-Welfare","language":"English","id":423797,"title":"Census 2027 Assistance and Support","summery":"The Office of the Registrar General and Census Commissioner has made available the several channels for support and assistance for the Census 2027.","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/community-power/census-2027/census-2027-assistance-and-support?lgn=en"},{"lgn":"en","context_path":"/social-welfare/senior-citizens-welfare/senior-holistic-care-assistance-and-training-for-your-utility","domain":"Social-Welfare","language":"English","id":426376,"title":"Senior Holistic Care Assistance and Training for Your Utility","summery":"SHATAYU (Senior Holistic Care Assistance and Training for Your Utility) is a digital initiative of the Department of Social Justice and Empowerment, Ministry of Social Justice And Empowerment towards strengthening the geriatric care ecosystem and ensuring dignified, accessible and dependable care for senior citizens.","url":"https://socialwelfare.vikaspedia.in/viewcontent/social-welfare/senior-citizens-welfare/senior-holistic-care-assistance-and-training-for-your-utility?lgn=en"}],"content":"\u003cp\u003eThe Ministry of Social Justice and Empowerment in its mission to ensure a life of dignity, security and inclusion for senior citizens has rolled out the National Helpline for Senior Citizens\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003etitled\u003cstrong\u003e Elderline 14567.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eElderline (14567)\u003c/strong\u003e\u0026nbsp;is a toll-free, pan-India helpline dedicated to addressing the concerns and grievances of senior citizens across the country.\u003c/p\u003e\n\u003cp\u003eDedicated to the nation on 1st October, 2021, the helpline operates all\u0026nbsp;\u003cstrong\u003eseven days in a week from 8:00 AM to 8:00 PM\u003c/strong\u003e\u0026nbsp;across all States and Union Territories. It serves as a single-window platform for providing information, guidance, emotional support and field interventions to elderly persons in need.\u003c/p\u003e\n\u003cp\u003e\u003cimg style=\"max-width: 100%; height: 247px; display: block; margin-left: auto; margin-right: auto;\" src=\"https://static.vikaspedia.in/mediastorage/filestorage/20260716103827_elderline.webp\" alt=\"Uploaded Image\" width=\"889\"\u003e\u003c/p\u003e\n\u003ch3\u003eVision and Mission of Elderline\u003c/h3\u003e\n\u003cdiv class=\"col-md-12\"\u003e\n\u003cp\u003eThe vision of the Elderline is to connect and engage with Senior Citizens and serve them in a compassionate manner.\u003c/p\u003e\n\u003cp\u003eThe mission of the Elderline is to make a positive difference to the lives of senior citizens through a single platform by redressing grievances of the senior citizens, by providing necessary information and field intervention through a collective effort of highly committed partners including government agencies, non-profit organizations, private sector, organisations working for the senior citizen\u0026rsquo;s cause and volunteers.\u003c/p\u003e\n\u003c/div\u003e\n\u003ch3\u003eServices offered through Elderline\u003c/h3\u003e\n\u003cp\u003eThe services offered through Elderline include information on healthcare facilities, old age homes, day-care centres, caregivers and elder-friendly products; guidance on legal issues, pension-related matters, government schemes, maintenance issues and dispute resolution.\u003c/p\u003e\n\u003cp\u003eIn addition, the Elderline covers field intervention for cases involving abuse, neglect, rescue, reunion of homeless senior citizens and emotional support to address loneliness, anxiety, family disputes and other psychosocial concerns.\u003c/p\u003e\n\u003ch3\u003eHow to access the Elderline\u003c/h3\u003e\n\u003cp\u003eDial 14567 from your mobile to access the services.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSource : \u003ca title=\"External website that opens in new window\" href=\"https://scw.dosje.gov.in/\" target=\"_blank\" rel=\"noopener\"\u003eAgeing with Dignity portal\u0026nbsp;\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e","lgn":"en","depth":3,"updated_at":"2026-07-16T05:10:40.000+00:00","subHeading":"\u003col\u003e\u003cli\u003e\u003ca href='#section1' \u003eVision and Mission of Elderline\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section2' \u003eServices offered through Elderline\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href='#section3' \u003eHow to access the Elderline\u003c/a\u003e\u003c/li\u003e\u003c/ol\u003e","domain":3,"context_type":"document","isInfoBotPage":false,"id":424388,"isCopy":false,"relatedKeywords":["senior citizen helpline","elderline","toll-free helpline","elderly care","14567","national helpline for senior citizens elderline 14567","ministry of social justice and empowerment","senior citizens helpline","elderline 14567","ageing with dignity","grievance redressal","ageing with dignity portal","elderly support services","toll free number for elderly"],"status":[{"isCurrent":false,"label":"Review in Process","value":1},{"isCurrent":true,"label":"Open","value":3},{"isCurrent":false,"label":"Deleted","value":4},{"isCurrent":false,"label":"Private","value":5},{"isCurrent":false,"label":"Published","value":6}]},"ssrPageData":null,"ssrNavMenu":[{"summary":"Provides information about the New Criminal Laws. ","children":[],"contextType":"folder","contextPath":"/social-welfare/new-criminal-laws","id":"419464","label":"New Criminal Laws"},{"summary":"This section provides information about the important documents for Indian citizens. ","children":[],"contextType":"folder","contextPath":"/social-welfare/important-documents-for-indian-citizens","id":"3572",
