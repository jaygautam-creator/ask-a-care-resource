[project]
name = "care-rag"
version = "0.1.0"
description = "Ask-a-Care-Resource: a RAG assistant over Indian senior-citizen schemes, with an honest evaluation."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "groq>=0.11",
    "tqdm>=4.66",
    "streamlit>=1.38",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/care_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
