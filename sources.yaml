# Corpus for Ask-a-Care-Resource (India).
# Every document the assistant can cite is listed here. `make ingest` fetches each URL once and
# snapshots the raw bytes into data/raw/ (committed), because government sites are often down
# (indiacode.nic.in, nha.gov.in, socialjustice.gov.in and nsap.nic.in were all unreachable while
# this corpus was built). Rebuilds therefore do not depend on those sites being up.
#
# Fields: id (stable, used as the citation/eval label), url, title, category, lang, publisher.

